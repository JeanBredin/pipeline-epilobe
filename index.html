<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; background: #064e3b; color: #fff; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { font-size: 12px; opacity: 0.9; }
  header .legend { display: flex; gap: 14px; font-size: 12px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  header .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; border: 1px solid rgba(255,255,255,0.5); }
  .b-go { background: #10b981; }
  .b-amber { background: #f59e0b; }
  .b-red { background: #dc2626; }
  #filters { padding: 8px 16px; background: #f0fdf4; border-bottom: 1px solid #bbf7d0; font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  #filters label { display: flex; gap: 6px; align-items: center; }
  #filters input[type=search] { width: 220px; }
  #map { flex: 1; }
  .popup { font-size: 13px; line-height: 1.45; max-width: 360px; }
  .popup b.title { display: block; margin-bottom: 4px; font-size: 14px; }
  .popup .row { margin: 3px 0; }
  .popup .muted { color: #6b7280; }
  .num { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; margin: 1px 3px 1px 0; }
  .pill-zone { background: #ecfdf5; color: #064e3b; border: 1px solid #a7f3d0; }
  .pill-age { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .pill-stars { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
  .pill-empl { background: #eff6ff; color: #1e3a8a; border: 1px solid #bfdbfe; }
  .risk-grid { margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 12px; }
  .risk-grid .k { color: #6b7280; }
  .risk-grid .v { font-weight: 500; }
  .v.ouilevel { color: #dc2626; }
  .v.faible { color: #65a30d; }
  .v.moyen { color: #d97706; }
  .v.inconnu { color: #9ca3af; }
  .v.none { color: #9ca3af; }
  .levers { margin-top: 8px; padding: 6px 8px; background: #ecfdf5; border-radius: 4px; font-size: 12px; }
  .verdict { margin-top: 6px; padding: 6px 8px; border-radius: 4px; font-weight: 500; font-size: 12px; }
  .verdict.go { background: #ecfdf5; color: #065f46; border-left: 3px solid #10b981; }
  .verdict.amber { background: #fffbeb; color: #92400e; border-left: 3px solid #f59e0b; }
  .verdict.red { background: #fef2f2; color: #991b1b; border-left: 3px solid #dc2626; }
  .links { font-size: 11px; margin-top: 4px; }
  .links a { color: #2563eb; margin-right: 8px; }
</style>
</head>

<div id="app">
  <header>
    <h1>Cibles retraite — risques (PPRI/PPRN) & contraintes PLU</h1>
    <span class="meta" id="meta">Chargement…</span>
    <div class="legend">
      <span><span class="dot b-go"></span>GO (extension OK + risque non confirmé)</span>
      <span><span class="dot b-amber"></span>Attention (1 flag)</span>
      <span><span class="dot b-red"></span>Risque fort (2 flags)</span>
      <span class="meta">Taille ∝ nb d'empl.</span>
    </div>
  </header>
  <div id="filters">
    <label><input type="checkbox" id="b-go" checked> Go</label>
    <label><input type="checkbox" id="b-amber" checked> Attention</label>
    <label><input type="checkbox" id="b-red" checked> Risque fort</label>
    <label><input type="checkbox" id="only-tourism"> Zone touristique uniquement</label>
    <label><input type="checkbox" id="no-flood"> Exclure PPRI inondation confirmé</label>
    <label><input type="checkbox" id="no-sea"> Exclure submersion marine</label>
    <label>Recherche: <input type="search" id="search" placeholder="nom, commune, dirigeant…"></label>
  </div>
  <div id="map"></div>
</div>

"Zone recouvrant les espaces naturels de la commune", "typezone": "N", "destdomi": null, "reglement": "83086_reglement_20240620.pdf"}, "expansion": "Zone naturelle stricte — extension très limitée"}, {"siren": "538390428", "nom": "TG GRAND LARGE", "commune": "SAINT-MAURICE-L'EXIL", "departement": "38", "adresse": "1 ROUTE DES ILES 38550 SAINT-MAURICE-L'EXIL", "lat": 45.375497558, "lon": 4.7690340633, "ca": 619536, "resultat_net": -447970, "annee_finance": "2021", "owner": "Daniel GONCALVES", "owner_age": 68, "owner_role": "Gérant", "forme": "5499", "stars": null, "pitches": null, "site": null, "match_score": 0.0, "ca_per_pitch": null, "target_stars": null, "revenue_uplift_estimate": null, "levers": ["Redressement opérationnel"], "risks": {"inondation": "Risque Existant", "remontee_nappe": "Risque Inconnu", "submersion_marine": null, "recul_trait_cote": null, "seisme": "Risque Existant - modéré", "mouvement_terrain": null, "argile": "Risque Existant - faible", "feux_foret": null, "radon": "Risque Existant - faible", "icpe": "Risque non Concerne", "rupture_barrage": "Risque Inconnu", "report_url": "https://www.georisques.gouv.fr/mes-risques/connaitre-les-risques-pres-de-chez-moi/rapport2?typeForm=adresse&city=Saint-Maurice-l%27Exil&codeInsee=38425&lon=4.7690340633&lat=45.375497558&adresse=1bis+Route+des+Iles%2C+38550+Saint-Maurice-l%27Exil"}, "zone": {"libelle": "A", "libelong": "Zone agricole a proteger en raison du potentiel agronomique, biologique ou economique des terres", "typezone": "A", "destdomi": null, "reglement": "38425_reglement_20230522.pdf"}, "expansion": "Zone agricole — extension très restreinte"}]</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const fmt = n => n == null ? "—" : new Intl.NumberFormat("fr-FR").format(n);
const fmtEuro = n => n == null ? "—" : new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
const starsTxt = n => "★".repeat(n || 0) + "☆".repeat(Math.max(0, 5 - (n || 0)));

const map = L.map("map", { preferCanvas: true }).setView([46.6, 2.5], 6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Géorisques · GPU IGN · Atout France',
  maxZoom: 18,
}).addTo(map);

const data = JSON.parse(document.getElementById("campings-data").textContent);

function isConfirmed(s) { return (s || "").toLowerCase().startsWith("risque existant"); }
function isUnknown(s) { return /inconnu|non connu/i.test(s || ""); }

function bucket(r) {
  const rk = r.risks || {};
  const confirmed = isConfirmed(rk.inondation) || isConfirmed(rk.submersion_marine) || isConfirmed(rk.recul_trait_cote);
  const badZone = /stricte|agricole/i.test(r.expansion || "");
  if (confirmed && badZone) return "red";
  if (confirmed || badZone) return "amber";
  return "go";
}
function color(b) { return b === "go" ? "#10b981" : b === "amber" ? "#f59e0b" : "#dc2626"; }
function radiusFor(r) {
  if (r.pitches) return Math.min(28, Math.max(8, Math.sqrt(r.pitches) * 0.9));
  // Fallback for unmatched (no Atout France data): size by CA, or default small.
  if (r.ca && r.ca > 0) return Math.min(20, Math.max(6, Math.sqrt(r.ca) / 300));
  return 6;
}

function riskCell(label, value) {
  if (!value) return `<span class="k">${label}</span><span class="v none">—</span>`;
  const v = value.toLowerCase();
  let cls = "ouilevel";
  if (v.includes("faible")) cls = "faible";
  else if (v.includes("moyen")) cls = "moyen";
  else if (v.includes("inconnu") || v.includes("non connu")) cls = "inconnu";
  return `<span class="k">${label}</span><span class="v ${cls}">${value}</span>`;
}

function verdictText(b) {
  if (b === "go") return `<div class="verdict go">✅ GO — extension réglementairement possible et pas de risque PPRI confirmé à l'adresse. Vérifier règlement PLU + emprise réelle.</div>`;
  if (b === "amber") return `<div class="verdict amber">⚠️ ATTENTION — un drapeau (zone restrictive ou risque PPRI confirmé). Étude approfondie avant offre.</div>`;
  return `<div class="verdict red">⛔ RISQUE FORT — zone PLU contraignante ET risque PPRI confirmé. Décote forte ou pass.</div>`;
}

const allMarkers = data.filter(r => r.lat != null && r.lon != null).map(r => {
  const b = bucket(r);
  const m = L.circleMarker([r.lat, r.lon], {
    radius: radiusFor(r),
    color: "#064e3b",
    weight: 1.2,
    fillColor: color(b),
    fillOpacity: 0.85,
  });
  const z = r.zone || {};
  const rk = r.risks || {};
  m.bindPopup(() => `<div class="popup">
    <b class="title">${r.nom || "—"}</b>
    <div class="row muted">${r.adresse || ""}</div>
    <div class="row">
      ${r.stars ? `<span class="pill pill-stars">${starsTxt(r.stars)}</span>` : ""}
      ${r.pitches ? `<span class="pill pill-empl">${fmt(r.pitches)} empl.</span>` : `<span class="pill pill-empl muted">non classé Atout France</span>`}
      <span class="pill pill-age">${r.owner_age} ans</span>
      ${z.libelle ? `<span class="pill pill-zone">PLU ${z.libelle}${z.libelong ? " — " + z.libelong : ""}</span>` : ""}
    </div>
    <div class="row">SIREN <span class="num">${r.siren}</span> · ${r.forme || ""} · CA <b class="num">${fmtEuro(r.ca)}</b> · RN <b class="num">${fmtEuro(r.resultat_net)}</b></div>
    <div class="row">${r.owner || "—"} <span class="muted">${r.owner_role ? "— " + r.owner_role : ""}</span></div>

    <div class="risk-grid">
      ${riskCell("Inondation", rk.inondation)}
      ${riskCell("Submersion marine", rk.submersion_marine)}
      ${riskCell("Recul trait de côte", rk.recul_trait_cote)}
      ${riskCell("Remontée nappe", rk.remontee_nappe)}
      ${riskCell("Retrait-gonflement argile", rk.argile)}
      ${riskCell("Mouvement de terrain", rk.mouvement_terrain)}
      ${riskCell("Séisme", rk.seisme)}
      ${riskCell("Feux de forêt", rk.feux_foret)}
      ${riskCell("Radon", rk.radon)}
      ${riskCell("ICPE proximité", rk.icpe)}
    </div>

    <div class="levers">
      <b>Expansion :</b> ${r.expansion || "—"}<br>
      <b>Leviers :</b> ${(r.levers || []).join(" · ") || "—"}
      ${r.revenue_uplift_estimate ? `<br><b>Uplift CA estimé :</b> ${fmtEuro(r.revenue_uplift_estimate)}/an (★${r.stars}→★${r.target_stars})` : ""}
    </div>

    ${verdictText(b)}

    <div class="links">
      ${rk.report_url ? `<a href="${rk.report_url}" target="_blank" rel="noopener">Rapport Géorisques</a>` : ""}
      <a href="https://www.geoportail-urbanisme.gouv.fr/map/#tile=1&lon=${r.lon}&lat=${r.lat}&zoom=18&mlon=${r.lon}&mlat=${r.lat}" target="_blank" rel="noopener">GPU (PLU)</a>
      ${r.site ? `<a href="${r.site}" target="_blank" rel="noopener">Site</a>` : ""}
    </div>
  </div>`, { maxWidth: 380 });
  m._record = r;
  m._bucket = b;
  return m;
});

const layer = L.markerClusterGroup({ chunkedLoading: true, showCoverageOnHover: false, maxClusterRadius: 45 });
map.addLayer(layer);

function applyFilters() {
  const show = {
    go: document.getElementById("b-go").checked,
    amber: document.getElementById("b-amber").checked,
    red: document.getElementById("b-red").checked,
  };
  const onlyTourism = document.getElementById("only-tourism").checked;
  const noFlood = document.getElementById("no-flood").checked;
  const noSea = document.getElementById("no-sea").checked;
  const q = document.getElementById("search").value.trim().toLowerCase();

  layer.clearLayers();
  const counts = { go: 0, amber: 0, red: 0 };
  for (const m of allMarkers) {
    const r = m._record;
    if (!show[m._bucket]) continue;
    if (onlyTourism && !/touristique|urbaniser/i.test(r.expansion || "")) continue;
    if (noFlood && isConfirmed((r.risks || {}).inondation)) continue;
    if (noSea && isConfirmed((r.risks || {}).submersion_marine)) continue;
    if (q) {
      const hay = `${r.nom || ""} ${r.commune || ""} ${r.owner || ""}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    layer.addLayer(m);
    counts[m._bucket]++;
  }
  const total = counts.go + counts.amber + counts.red;
  document.getElementById("meta").textContent =
    `${fmt(total)} affichés · 🟢 ${counts.go} go · 🟡 ${counts.amber} attention · 🔴 ${counts.red} risque fort`;
}

applyFilters();
for (const id of ["b-go", "b-amber", "b-red", "only-tourism", "no-flood", "no-sea", "search"]) {
  document.getElementById(id).addEventListener("input", applyFilters);
}
</script>
